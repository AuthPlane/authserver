name: Security

on:
  push:
    branches: [main, develop, 'epic/**', 'release/**']
  pull_request:
    branches: [main, develop, 'epic/**', 'release/**']
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          # e2e/ and compliance/ are separate Go modules; a root-level
          # `govulncheck ./...` never sees them. Scan each module in turn and
          # apply the same exit-code dispatch to every run.
          FAILED=0
          for MOD in . e2e compliance; do
            # The published tree does not carry every module; skip what is absent.
            if [ ! -f "$MOD/go.mod" ]; then
              echo "govulncheck ($MOD): no module here, skipped"
              continue
            fi
            echo "::group::govulncheck ($MOD)"
            set +e
            OUTPUT=$(cd "$MOD" && govulncheck ./... 2>&1)
            EXIT_CODE=$?
            echo "$OUTPUT"
            set -e

            # govulncheck's exit codes: 0 = clean, 3 = vulnerabilities found,
            # anything else = it failed to run. Dispatch on the code rather than
            # on "non-zero", so a toolchain/network/load error can never be
            # mistaken for a clean or merely-stdlib result.
            case "$EXIT_CODE" in
              0)
                echo "No vulnerabilities found in $MOD."
                ;;
              3)
                # Findings are attributed either to the standard library (which
                # prints a bare "Standard library" line and is only fixable by
                # bumping Go) or to a dependency (which prints "Module: <path>").
                # Any Module: line therefore means something is fixable here.
                if echo "$OUTPUT" | grep -qE '^[[:space:]]*Module:[[:space:]]'; then
                  echo ""
                  echo "::error::Third-party dependency vulnerabilities found in $MOD."
                  FAILED=1
                else
                  echo ""
                  echo "::warning::Only Go stdlib vulnerabilities found in $MOD — upgrade Go to fix."
                fi
                ;;
              *)
                echo ""
                echo "::error::govulncheck failed to run in $MOD (exit $EXIT_CODE); no vulnerability report was produced."
                FAILED=1
                ;;
            esac
            echo "::endgroup::"
          done
          exit $FAILED

  trivy:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history to diff against the PR base for change detection.
          fetch-depth: 0
      - name: Detect image-relevant changes
        id: changes
        run: |
          # Always scan on push (main/develop) and on schedule. Only PRs
          # get the change-detection short-circuit, since a PR that doesn't
          # touch any image input cannot change what trivy would report.
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$CHANGED" | grep -Eq '^(build/Dockerfile|go\.mod|go\.sum|\.github/workflows/security\.yml)$|^(internal|api|cmd)/'; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No image inputs changed; skipping container scan."
          fi
      - name: Build image
        if: steps.changes.outputs.should_scan == 'true'
        run: docker build -t authserver:scan -f build/Dockerfile .
      - uses: aquasecurity/trivy-action@master
        if: steps.changes.outputs.should_scan == 'true'
        with:
          image-ref: authserver:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
