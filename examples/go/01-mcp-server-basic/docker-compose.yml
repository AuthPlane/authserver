# NOTE: this example inlines the `authserver` service definition rather than
# using `include: ../../_shared/docker-compose.authserver.yml`. Compose's
# `include:` directive keeps `env_file` and bind-mount paths relative to the
# included file's directory, which means the shared compose looks for a `.env`
# under `examples/_shared/` and the config file at `_shared/config.example.yaml`.
# The example's own `.env` lives here, so duplicating the service definition
# is the least-magical fix. Keep this block in sync with
# `../../_shared/docker-compose.authserver.yml` when that file changes.
services:
  authserver:
    image: authplane/authserver:latest
    # ---------------------------------------------------------------------
    # LOCAL BUILD ESCAPE HATCH — see ../../_shared/docker-compose.authserver.yml
    # ---------------------------------------------------------------------
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../../_shared/config.example.yaml:/config.yaml:ro
      - authserver-data:/data
    command: ["serve", "--config", "/config.yaml"]
    restart: unless-stopped
    # NOTE: do NOT add a `wget`/`curl`-based healthcheck here. The
    # authserver image is distroless — no shell, no wget, no curl. Any
    # such healthcheck will always report unhealthy. See
    # docs/guides/deploy/docker-compose.md § "Healthcheck note".

  mcp-server:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - authserver
    restart: unless-stopped

volumes:
  authserver-data:
