# Minimal authserver config shared by every example.
# Individual examples may layer additional config via env vars or by mounting
# their own override file; this file is the common baseline.

server:
  # `AUTHPLANE_SERVER_ISSUER` env overrides this value. The docker-compose
  # examples set it to `http://authserver:9000` (the docker network name)
  # so the SDK inside the MCP container can reach the AS and pass the
  # `metadata.issuer == config.issuer` check.
  issuer: http://localhost:9000
  address: ":9000"

storage:
  driver: sqlite
  sqlite:
    path: /data/authserver.db
    wal: true

signing:
  algorithm: ES256
  key_path: /data/keys

dcr:
  mode: open

admin:
  enabled: true
  address: ":9001"
  api_key: ${AUTHPLANE_ADMIN_API_KEY}

# Grant switches. Every grant is on by default as of v0.2.0; listed here so
# the posture is visible, and so the matching `AUTHPLANE_<NAME>_ENABLED`
# env vars in `.env` have a documented home (the env value overrides
# whatever's in this file). Set one to false to turn it off.
# Full reference: docs/reference/configuration.md § client_credentials,
# § dpop, § token_exchange.
client_credentials:
  enabled: true        # AUTHPLANE_CLIENT_CREDENTIALS_ENABLED — machine-to-machine
dpop:
  enabled: true        # AUTHPLANE_DPOP_ENABLED — RFC 9449 proof-of-possession
token_exchange:
  enabled: true        # AUTHPLANE_TOKEN_EXCHANGE_ENABLED — RFC 8693 token exchange
