[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authplane-example-python-02"
version = "0.1.0"
description = "Tier 02 — Basic agent that acquires an Authplane token and calls a protected MCP tool (Python)."
requires-python = ">=3.12"
dependencies = [
  # Authplane SDK (PyPI). Pinned to the exact version the example was developed
  # and verified against; bump together with the SDK.
  "authplane-sdk==0.3.0",
  # httpx is already a transitive dep of authplane-sdk, but pin it explicitly
  # because agent.py uses it directly to POST to the MCP server.
  "httpx>=0.27,<1",
]

[tool.setuptools]
py-modules = ["agent"]
