[project]
name = "retrofit-after"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    # The Authplane adapter is the only new dep, but it does raise the FastMCP
    # floor: authplane-fastmcp 0.3.0 requires fastmcp>=3.2, where before/ needs
    # only 3.0. Declared here so the constraint is visible, not resolver-only.
    "fastmcp>=3.2,<4",
    "authplane-sdk==0.3.0",
    "authplane-fastmcp==0.3.0",
]
