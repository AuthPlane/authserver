# Prometheus configuration for authserver observability stack.
# Scrapes authserver /metrics for local queries. Mimir receives metrics via OTLP
# (authserver → Alloy → Mimir), so remote_write is not needed here.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules (see docs/guides/operate/incident-runbook.md for the runbook anchors).
rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: authserver
    scrape_interval: 10s
    static_configs:
      - targets: ["authserver:9001"]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
