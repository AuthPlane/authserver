components:
  schemas:
    AgentsConfigView:
      type: object
      properties:
        enabled:
          type: boolean
        jwks_listing:
          type: boolean
      required:
        - enabled
        - jwks_listing
    AuditEventView:
      type: object
      properties:
        action:
          type: string
        actor_id:
          type: string
        client_id:
          type: string
        created_at:
          type: string
        detail:
          type: string
        id:
          type: string
        ip:
          type: string
        trace_id:
          type: string
      required:
        - action
        - actor_id
        - client_id
        - created_at
        - detail
        - id
        - ip
        - trace_id
      description: auditEventView is the JSON representation of an audit event.
    AuthVerifyResponse:
      type: object
      properties:
        valid:
          type: boolean
        version:
          type: string
      required:
        - valid
        - version
      description: authVerifyResponse is the JSON body for POST /admin/auth/verify.
    BrokerGrantView:
      type: object
      properties:
        broker_provider_id:
          type: string
        created_at:
          type: string
        enc_backend:
          type: string
        id:
          type: string
        revoked_at:
          type: string
          format: date-time
          nullable: true
        scopes_granted:
          type: array
          items:
            type: string
        updated_at:
          type: string
        user_id:
          type: string
        version:
          type: integer
          format: int64
      required:
        - broker_provider_id
        - created_at
        - enc_backend
        - id
        - scopes_granted
        - updated_at
        - user_id
        - version
      description: 'BrokerGrantView is the wire-level form of a broker_grants row. SECURITY: credential_data is NEVER part of this struct. The encrypted upstream credential must never appear in any admin response — defense in depth even against an admin reading the JSON. The runtime regression test TestAdmin_BrokerGrantViews_NeverLeakCredentialData asserts the field key is absent from every admin response that returns broker_grant data; type-system absence here is the primary guard. If a future contributor reaches to add the field "for completeness", STOP — see the design'
    BrokerProviderView:
      type: object
      properties:
        config_data:
          description: Opaque JSON value (passthrough).
          additionalProperties: true
        created_at:
          type: string
        display_name:
          type: string
        id:
          type: string
        protocol:
          type: string
        slug:
          type: string
        updated_at:
          type: string
      required:
        - config_data
        - created_at
        - display_name
        - id
        - protocol
        - slug
        - updated_at
      description: BrokerProviderView is the sanitized JSON representation of a BrokerProvider. `config_data` is a JSON RawMessage round-tripped byte-for-byte; the admin layer never inspects it.
    ClientCredentialsConfigView:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    ClientView:
      type: object
      properties:
        cimd_url:
          type: string
        grant_types:
          type: array
          items:
            type: string
        id:
          type: string
        issued_at:
          type: string
          format: date-time
        name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        registration_source:
          type: string
        response_types:
          type: array
          items:
            type: string
        status:
          type: string
        token_endpoint_auth_method:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
        - cimd_url
        - grant_types
        - id
        - issued_at
        - name
        - redirect_uris
        - registration_source
        - response_types
        - status
        - token_endpoint_auth_method
        - updated_at
      description: clientView is the sanitized JSON representation of a client (no secrets).
    ConnectPolicyView:
      type: object
      properties:
        allowed_return_urls:
          type: array
          items:
            type: string
      required:
        - allowed_return_urls
      description: ConnectPolicyView is the JSON form of resource.ConnectPolicy.
    ConsentGrantView:
      type: object
      properties:
        client_id:
          type: string
        created_at:
          type: string
        id:
          type: string
        resource_id:
          type: string
        revoked_at:
          type: string
          format: date-time
          nullable: true
        scopes:
          type: array
          items:
            type: string
        updated_at:
          type: string
        user_id:
          type: string
      required:
        - client_id
        - created_at
        - id
        - resource_id
        - scopes
        - updated_at
        - user_id
      description: ConsentGrantView is the wire-level form of a consent_grants row. The admin surface shows full history (active + revoked); RevokedAt is a pointer + omitempty so the field is absent for active rows.
    CreateBrokerProviderRequest:
      type: object
      properties:
        config_data:
          description: Opaque JSON value (passthrough).
          additionalProperties: true
        display_name:
          type: string
        protocol:
          type: string
        slug:
          type: string
      required:
        - config_data
        - display_name
        - protocol
        - slug
      description: createBrokerProviderRequest is the JSON body for POST /admin/broker-providers.
    CreateClientRequest:
      type: object
      properties:
        agent:
          type: boolean
        agent_description:
          type: string
        client_name:
          type: string
        grant_types:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string
        token_endpoint_auth_method:
          type: string
      required:
        - agent
        - agent_description
        - client_name
        - grant_types
        - redirect_uris
        - response_types
        - scope
        - token_endpoint_auth_method
      description: createClientRequest is the JSON body for POST /admin/clients.
    CreateClientResponse:
      type: object
      properties:
        agent:
          type: boolean
        agent_description:
          type: string
        client_id:
          type: string
        client_name:
          type: string
        client_secret:
          type: string
        grant_types:
          type: array
          items:
            type: string
        issued_at:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        registration_source:
          type: string
        response_types:
          type: array
          items:
            type: string
        scope:
          type: string
        status:
          type: string
        token_endpoint_auth_method:
          type: string
      required:
        - client_id
        - client_name
        - grant_types
        - issued_at
        - redirect_uris
        - registration_source
        - response_types
        - scope
        - status
        - token_endpoint_auth_method
      description: createClientResponse is the JSON body for POST /admin/clients (201). The client_secret is shown once and never stored in plaintext.
    CreateFrontingLinkRequest:
      type: object
      properties:
        scope_map:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        source:
          type: string
        target:
          type: string
      required:
        - scope_map
        - source
        - target
      description: createFrontingLinkRequest is the JSON body for POST /admin/fronting (and the validation preflight POST /admin/fronting?dry_run=true). All three fields are required; the service applies validation rule-by-rule and returns the most specific failure.
    CreateResourceRequest:
      type: object
      properties:
        backend_kind:
          type: string
        broker_provider_id:
          type: string
        broker_provider_slug:
          type: string
        display_name:
          type: string
        policy:
          type: string
          nullable: true
          description: type `policyView` — see `docs/reference/http-api.md`
        scopes:
          type: array
          items:
            type: string
            description: type `scopeWithUpstreamView` — see `docs/reference/http-api.md`
        slug:
          type: string
        uri:
          type: string
      required:
        - backend_kind
        - display_name
        - scopes
        - slug
        - uri
      description: createResourceRequest is the JSON body for POST /admin/resources. BrokerProviderSlug is the slug-friendly alternative to BrokerProviderID. Operators may supply either one — the handler resolves the slug to a UUID before persistence. Supplying both with inconsistent values returns 400; supplying both with consistent values is accepted and the slug is honored.
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        role:
          type: string
      required:
        - email
        - name
        - password
        - role
      description: createUserRequest is the JSON body for POST /admin/users.
    DcrConfigView:
      type: object
      properties:
        mode:
          type: string
      required:
        - mode
    DcrSettingsView:
      type: object
      properties:
        mode:
          type: string
      required:
        - mode
      description: dcrSettingsView is the JSON body for GET/PATCH /admin/settings/dcr.
    DpopConfigView:
      type: object
      properties:
        enabled:
          type: boolean
        nonce_ttl:
          type: string
        require_nonce:
          type: boolean
      required:
        - enabled
        - require_nonce
    EncryptionConfigView:
      type: object
      properties:
        driver:
          type: string
      required:
        - driver
    ExchangePolicyView:
      type: object
      properties:
        allowed_client_ids:
          type: array
          items:
            type: string
      required:
        - allowed_client_ids
      description: ExchangePolicyView is the JSON form of resource.ExchangePolicy.
    FrontingLinkConflictResponse:
      type: object
      properties:
        dependents:
          type: array
          items:
            type: string
            description: type `frontingLinkView` — see `docs/reference/http-api.md`
        detail:
          type: string
      required:
        - dependents
        - detail
      description: frontingLinkConflictResponse is the body of the 409 returned from DELETE /admin/resources/{id} when fronting links reference the resource and ?cascade=true was not supplied. Callers (UI, CLI) read `dependents` to render the cascade-confirmation modal.
    FrontingLinkView:
      type: object
      properties:
        created_at:
          type: string
        created_by:
          type: string
        scope_map:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        source_slug:
          type: string
        target_slug:
          type: string
      required:
        - created_at
        - created_by
        - scope_map
        - source_slug
        - target_slug
      description: 'FrontingLinkView is the wire-level shape of a fronting_links row. ScopeMap is emitted as a JSON object { source_scope: [target_scope, ...] } per the canonical 1:N wire shape.'
    IssuanceListResponse:
      type: object
      properties:
        count:
          type: integer
          format: int32
        issuances:
          type: array
          items:
            $ref: '#/components/schemas/IssuanceView'
        since:
          type: string
      required:
        - count
        - issuances
        - since
      description: IssuanceListResponse is the JSON body for GET /admin/issuances. `since` is the effective window-start time used by the underlying query; for the ?jti=… form it is the zero value (no window applied).
    IssuanceView:
      type: object
      properties:
        agent_chain:
          type: array
          items:
            type: string
        agent_id:
          type: string
        backend_kind:
          type: string
        client_id:
          type: string
        dpop_jkt:
          type: string
        expires_at:
          type: string
        id:
          type: string
        issued_at:
          type: string
        jti:
          type: string
        resource_id:
          type: string
        revocable:
          type: boolean
        revoked_at:
          type: string
          format: date-time
          nullable: true
        scopes:
          type: array
          items:
            type: string
        subject_user_id:
          type: string
      required:
        - agent_chain
        - backend_kind
        - client_id
        - expires_at
        - id
        - issued_at
        - jti
        - resource_id
        - revocable
        - scopes
        - subject_user_id
      description: IssuanceView is the wire-level form of an issuances row. AgentChain is non-nil empty by default for the same reason as Scopes.
    KeyView:
      type: object
      properties:
        alg:
          type: string
        kid:
          type: string
        status:
          type: string
        use:
          type: string
      required:
        - alg
        - kid
        - status
        - use
      description: keyView is the JSON representation of a signing key (public info only).
    ListKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyView'
      required:
        - keys
      description: listKeysResponse is the JSON body for GET /admin/keys.
    OidcConfigView:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    PatchBrokerProviderRequest:
      type: object
      properties:
        config_data:
          nullable: true
          description: Opaque JSON value (passthrough).
          additionalProperties: true
        display_name:
          type: string
          nullable: true
        protocol:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
      description: patchBrokerProviderRequest is the JSON body for PATCH /admin/broker-providers/{id}. Pointer fields enable partial updates.
    PatchFrontingLinkRequest:
      type: object
      properties:
        scope_map:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
      description: 'patchFrontingLinkRequest is the JSON body for PATCH /admin/fronting/{source}/{target}. Only ScopeMap is patchable — rewiring source/target requires delete + recreate. PATCH-dirty semantics: a nil pointer field is LEFT UNCHANGED. Sending the explicit `{}` empty object would be a wipe (rejected by domain validation since scope_map must contain at least one entry). This mirrors the security-by-default rule on input.ResourcePatch.'
    PatchResourceRequest:
      type: object
      properties:
        backend_kind:
          type: string
          nullable: true
        broker_provider_id:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        policy:
          type: string
          nullable: true
          description: type `policyView` — see `docs/reference/http-api.md`
        scopes:
          type: array
          items:
            type: string
            description: type `scopeWithUpstreamView` — see `docs/reference/http-api.md`
          nullable: true
        slug:
          type: string
          nullable: true
        uri:
          type: string
          nullable: true
      description: patchResourceRequest is the JSON body for PATCH /admin/resources/{id}. Pointer fields enable partial updates with the security-by-default rule described on input.ResourcePatch.
    PolicyView:
      type: object
      properties:
        connect:
          $ref: '#/components/schemas/ConnectPolicyView'
          nullable: true
        exchange:
          $ref: '#/components/schemas/ExchangePolicyView'
        runtime:
          $ref: '#/components/schemas/RuntimePolicyView'
      required:
        - exchange
        - runtime
      description: PolicyView is the JSON form of resource.Policy. Connect is a pointer so `omitempty` actually fires for Mint resources (which have no Connect policy semantics — see the design §6); a struct-typed field with omitempty is a no-op in encoding/json, which is why this field is *ConnectPolicyView.
    RateLimitConfigView:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    ResourceFrontingView:
      type: object
      properties:
        fronted_by:
          type: array
          items:
            $ref: '#/components/schemas/FrontingLinkView'
          description: 'inbound: this resource is the target'
        fronts:
          type: array
          items:
            $ref: '#/components/schemas/FrontingLinkView'
          description: 'outbound: this resource is the source'
        slug:
          type: string
      required:
        - fronted_by
        - fronts
        - slug
      description: ResourceFrontingView bundles the two-direction lookup served by GET /admin/resources/{slug}/fronting. Each half is a non-nil slice so callers always see a JSON array. §Admin API.
    ResourceView:
      type: object
      properties:
        backend_kind:
          type: string
        broker_provider_id:
          type: string
        created_at:
          type: string
        display_name:
          type: string
        id:
          type: string
        policy:
          $ref: '#/components/schemas/PolicyView'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeView'
        slug:
          type: string
        updated_at:
          type: string
        uri:
          type: string
      required:
        - backend_kind
        - broker_provider_id
        - created_at
        - display_name
        - id
        - policy
        - scopes
        - slug
        - updated_at
        - uri
      description: ResourceView is the sanitized JSON representation of a unified Resource. For Mint resources broker_provider_id is "" and the connect policy is omitted from the wire form.
    RotateKeyResponse:
      type: object
      properties:
        alg:
          type: string
        kid:
          type: string
      required:
        - alg
        - kid
      description: rotateKeyResponse is the JSON body for POST /admin/keys/rotate.
    RotateSecretResponse:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
      required:
        - client_id
        - client_secret
      description: rotateSecretResponse is the JSON body for POST /admin/clients/{id}/rotate-secret (200). The client_secret is shown once and never stored in plaintext.
    RuntimePolicyView:
      type: object
      properties:
        client_ids:
          type: array
          items:
            type: string
      required:
        - client_ids
      description: RuntimePolicyView is the JSON form of resource.RuntimePolicy. Lists the OAuth client_ids authorized to act AS this Resource at runtime.
    ScopeView:
      type: object
      properties:
        description:
          type: string
        name:
          type: string
        upstream:
          type: string
      required:
        - name
      description: ScopeView is the wire-level form of a scope on a unified Resource. Carries the optional `upstream` mapping used by Broker resources; Mint resources omit it.
    SigningConfigView:
      type: object
      properties:
        algorithm:
          type: string
        key_store:
          type: string
      required:
        - algorithm
        - key_store
    StatsView:
      type: object
      properties:
        active_tokens_24h:
          type: integer
          format: int32
        clients:
          type: integer
          format: int32
        connections:
          type: integer
          format: int32
        revoked_tokens:
          type: integer
          format: int32
        users:
          type: integer
          format: int32
      required:
        - active_tokens_24h
        - clients
        - connections
        - revoked_tokens
        - users
      description: statsView is the JSON body for GET /admin/stats.
    StatusResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status
      description: statusResponse is the JSON body for simple status-only responses.
    StorageConfigView:
      type: object
      properties:
        driver:
          type: string
      required:
        - driver
    SubsystemStatus:
      type: object
      properties:
        driver:
          type: string
        name:
          type: string
        status:
          type: string
      required:
        - name
        - status
      description: subsystemStatus represents the health status of a server subsystem.
    SystemConfigResponse:
      type: object
      properties:
        agents:
          $ref: '#/components/schemas/AgentsConfigView'
        client_credentials:
          $ref: '#/components/schemas/ClientCredentialsConfigView'
        dcr:
          $ref: '#/components/schemas/DcrConfigView'
        dpop:
          $ref: '#/components/schemas/DpopConfigView'
        encryption:
          $ref: '#/components/schemas/EncryptionConfigView'
        issuer:
          type: string
        oidc:
          $ref: '#/components/schemas/OidcConfigView'
        rate_limit:
          $ref: '#/components/schemas/RateLimitConfigView'
        signing:
          $ref: '#/components/schemas/SigningConfigView'
        storage:
          $ref: '#/components/schemas/StorageConfigView'
        token_exchange:
          $ref: '#/components/schemas/TokenExchangeConfigView'
      required:
        - agents
        - client_credentials
        - dcr
        - dpop
        - encryption
        - issuer
        - oidc
        - rate_limit
        - signing
        - storage
        - token_exchange
      description: systemConfigResponse is the JSON body for GET /admin/system/config.
    SystemStatusResponse:
      type: object
      properties:
        subsystems:
          type: array
          items:
            $ref: '#/components/schemas/SubsystemStatus'
        uptime:
          type: string
        uptime_secs:
          type: integer
          format: int64
        version:
          type: string
      required:
        - subsystems
        - uptime
        - uptime_secs
        - version
      description: systemStatusResponse is the JSON body for GET /admin/system/status.
    TokenExchangeConfigView:
      type: object
      properties:
        enabled:
          type: boolean
        max_chain_depth:
          type: integer
          format: int32
      required:
        - enabled
    UpdateClientRequest:
      type: object
      properties:
        client_name:
          type: string
          nullable: true
        grant_types:
          type: array
          items:
            type: string
          nullable: true
        redirect_uris:
          type: array
          items:
            type: string
          nullable: true
        scope:
          type: string
          nullable: true
      description: updateClientRequest is the JSON body for PATCH /admin/clients/{id}. Pointer fields enable partial updates — only non-null fields are applied.
    UpdateDCRSettingsRequest:
      type: object
      properties:
        mode:
          type: string
      required:
        - mode
      description: updateDCRSettingsRequest is the JSON body for PATCH /admin/settings/dcr.
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
    UserGrantsView:
      type: object
      properties:
        broker_grants:
          type: array
          items:
            $ref: '#/components/schemas/BrokerGrantView'
        consent_grants:
          type: array
          items:
            $ref: '#/components/schemas/ConsentGrantView'
      required:
        - broker_grants
        - consent_grants
      description: UserGrantsView is the JSON body for GET /admin/users/{id}/grants and for the equivalent CLI form. Each list defaults to an empty array on the wire (not null) so client tooling always parses an array.
    UserView:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        role:
          type: string
        status:
          type: string
      required:
        - created_at
        - email
        - id
        - name
        - provider
        - role
        - status
      description: userView is the sanitized JSON representation of a user (no password hash).
  securitySchemes:
    AdminAPIKey:
      type: http
      scheme: bearer
      description: Bearer auth using `AUTHPLANE_ADMIN_API_KEY`. The admin server has no other auth mode; every protected route requires this header.
