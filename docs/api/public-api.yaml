components:
  schemas:
    HealthResponse:
      type: object
      properties:
        db:
          type: string
        status:
          type: string
        time:
          type: string
      required:
        - status
        - time
      description: healthResponse is the JSON body for GET /livez, GET /health and GET /ready.
    OAuthErrorResponse:
      type: object
      properties:
        cause:
          type: string
          description: 'Cause is a sub-discriminator for consent_required errors. Values currently in use: "consent_missing" (user never authorized this agent for this resource), "scope_insufficient" (user authorized a strict subset of the requested scopes). Empty for non-consent errors and for legacy consent errors that predate the field. Wire format is `cause` (lowercase, omitempty).'
        consent_url:
          type: string
          description: ConsentURL is a URL to a consent page where the user can authorize the AS to access an upstream provider. Populated only by WriteOAuthErrorWithConsent / WriteOAuthErrorWithConsentAndCause; omitted from all other error responses.
        detail:
          type: string
        error:
          type: string
        error_description:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
      required:
        - detail
        - error
        - error_description
        - status
        - title
        - type
      description: OAuthErrorResponse is the combined OAuth + RFC 9457 error response.
    TokenExchangeResponseDTO:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int32
        issued_token_type:
          type: string
        scope:
          type: string
        token_type:
          type: string
      required:
        - access_token
        - expires_in
        - issued_token_type
        - token_type
      description: tokenExchangeResponseDTO is the JSON response for RFC 8693 token exchange. It includes issued_token_type which is not present in standard token responses.
    TokenResponseDTO:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int32
        refresh_token:
          type: string
        scope:
          type: string
        token_type:
          type: string
      required:
        - access_token
        - expires_in
        - token_type
      description: tokenResponseDTO is the JSON structure for POST /oauth/token responses.
  securitySchemes:
    OAuth2Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.1 access token issued by `/oauth/token` (or via federation through `/oidc/start` -> `/oidc/callback`).
    SessionCookie:
      type: apiKey
      name: authplane_session
      in: cookie
      description: Browser session cookie set by the AS login + consent flows. Used by the human-driven endpoints (`/oauth/authorize`, `/connect/{provider}`, …).
