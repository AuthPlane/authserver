{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authplane.fullname" . }}
  labels:
    {{- include "authplane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authplane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: 9000
          protocol: TCP
        - port: 9001
          protocol: TCP
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
