version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters (explicit — gosimple merged into staticcheck in v2)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Bugs & correctness
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck

    # Security
    - gosec

    # Style & quality
    - misspell
    - unconvert
    - unparam
    - wastedassign
    - prealloc

  settings:
    gosec:
      excludes:
        # We use crypto/rand, not math/rand — but some test helpers use math/rand
        - G404
        # OAuth server must return access_token/client_secret in JSON responses per spec
        - G117
        # Form parsing is already bounded by upstream middleware/timeouts
        - G120
        # XSS taint analysis false positives — responses are JSON, not HTML
        - G705
    govet:
      enable-all: true
      disable:
        - fieldalignment  # Too noisy, marginal benefit
    misspell:
      locale: US

  exclusions:
    rules:
      # Test files can use dot imports and have longer functions
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - prealloc
      # Allow fmt.Print in cmd/ (CLI output)
      - path: cmd/
        linters:
          - forbidigo
      # ConsentRequiredError.Service is deprecated in favour of ResourceSlug
      # and ProviderSlug but is still populated for existing readers until a
      # minor release removes it. Setting it is intentional.
      - linters:
          - staticcheck
        text: "SA1019: .*ConsentRequiredError\\)\\.Service is deprecated"
      # G124 (added in golangci-lint v2.15.0) cannot see a Secure flag that is
      # computed at runtime. The session, login-nonce and OIDC-state cookies
      # are HttpOnly, carry an explicit SameSite, and set Secure from the
      # cookie policy with the boot Secure floor applied; plain-HTTP local
      # development is the only case where it is false.
      - path: api/(shared/session|public/oauth/(login|oidc))\.go
        linters:
          - gosec
        text: "G124:"
    paths:
      - vendor
      - node_modules
      - web/admin
      - ".*_gen\\.go$"
      - ".*\\.pb\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/authplane/authserver
